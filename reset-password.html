<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow" style="width: 400px;">
        
        <h3 class="text-center mb-4">Reset Password</h3>

        <form>

            
            <div class="mb-3">
                <label class="form-label">Email</label>
                <div class="d-flex">
                    <input type="email" class="form-control me-2" placeholder="Enter Email">
                    <button class="btn btn-secondary">Send OTP</button>
                </div>
            </div>

            
            <div class="mb-3">
                <label class="form-label">OTP</label>
                <input type="number" class="form-control" placeholder="Enter OTP">
            </div>

            
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" placeholder="Enter New Password">
            </div>

            
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" placeholder="Confirm Password">
            </div>

            
            <button class="btn btn-success w-100" onclick="window.location.href='login.html'">
                Confirm
            </button>

        </form>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
